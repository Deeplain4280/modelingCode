[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surpass-marketing"
version = "1.0.0"
description = "品牌手机（Surpass）目标用户购买意愿建模与精准营销决策支持系统"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "数学建模课程设计" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
surpass = "surpass_marketing.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
surpass_marketing = ["../../configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"
