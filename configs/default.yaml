project:
  name: surpass-marketing
  title: 品牌手机目标用户的精准营销
  version: "1.0.0"

runtime:
  seed: 42
  test_size: 0.2
  cv_folds: 5
  n_jobs: 1
  top_n: 100

business:
  # 分层阈值：按训练集全体用户预测分数的分位数确定（先验规则，不看过附件2标签）
  tier_high_quantile: 0.90      # 分数前 10% 为高潜力
  tier_medium_quantile: 0.70    # 前 10%~30% 为中潜力，其余为低潜力
  contact_cost: 5.0             # 单次触达成本（元），用于成本收益阈值
  conversion_value: 100.0       # 单次转化毛利（元）
  attachment2_expected_users: 50

data:
  raw_dir: "B题/B题附件"
  attachment1: "附件1 Surpass目标用户数据1.xlsx"
  attachment2: "附件2 待判数据.xlsx"
  purchase_state: "购买"
  # 目标用户表中被错误命名的列：实际为“最后跟踪时间”时间戳
  user_time_column: "在某购物平台上的平均每次停留的时间    分:秒"
  user_state_column: "最后一次跟踪的状态"
  user_id_column: "用户编号"

outputs:
  interim: "outputs/interim"
  tables: "outputs/tables"
  figures: "outputs/figures"
  models: "outputs/models"
  logs: "outputs/logs"

model:
  logistic:
    C: 0.5
    max_iter: 3000
    class_weight: balanced
  random_forest:
    n_estimators: 400
    max_depth: 12
    min_samples_leaf: 5
  hist_gradient_boosting:
    max_iter: 300
    learning_rate: 0.05
    max_leaf_nodes: 31
    l2_regularization: 1.0
  calibration:
    method: sigmoid
    cv: 5
